name: Android CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: meta
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$version" || { echo "versionName not found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug

      - name: Assemble debug and release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify the debug APK exists
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk" || { echo "::error::$apk is missing or empty"; exit 1; }
          cp "$apk" "pdf-scanner-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}-debug.apk"
          ls -l pdf-scanner-*-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-scanner-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.short_sha }}-debug-apk
          path: pdf-scanner-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.meta.outputs.short_sha }}
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # Runs only when the owner pushes an explicit version tag such as v1.0.0.
  # Attaches the *debug* APK (installable, signed with the debug key). The unsigned
  # release APK is deliberately not published: it cannot be installed and is not
  # production-ready. No signing secrets are used anywhere in this workflow.
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag matches app version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ needs.build.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName ${{ needs.build.outputs.version }} in app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-scanner-*-debug-apk
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pdf-scanner-*-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "PDF Scanner $GITHUB_REF_NAME" \
            --notes "Debug-signed APK for testing and sideloading. Not a Play Store build." \
            --prerelease

  # Rolling pre-release holding one plain .apk at a stable URL, refreshed on every push to the
  # development branch. Debug-signed, for testing/sideloading only. Uses only the built-in token.
  latest:
    name: Update latest-debug release
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/amazing-babbage-qr2tmb'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdf-scanner-*-debug-apk
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(ls pdf-scanner-*-debug.apk)
          cp "$src" pdf-scanner-debug.apk
          gh release delete latest-debug --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest-debug pdf-scanner-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest debug build (${GITHUB_SHA::7})" \
            --notes "Debug-signed APK built from commit $GITHUB_SHA ($src). For testing and sideloading only; not a Play Store build."
